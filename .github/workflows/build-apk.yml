name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'channels.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Place main.dart
        run: |
          if [ -f main.dart ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name mahmoud_stream --org com.mahmoud _tmp
          cp -r _tmp/android android
          rm -rf _tmp
      - name: Manifest settings
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$f"
          sed -i 's#android:label="mahmoud_stream"#android:label="بث محمود"#' "$f"
      - name: Disable release lint checks
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.kts ]]; then
              sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$f"
            else
              sed -i '0,/^android {/s//android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' "$f"
            fi
          done
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BUILD=${{ github.run_number }}
      - name: Sign with fixed key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Signing secrets not set; keeping debug signature"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AS" sign --ks "$RUNNER_TEMP/upload.p12" --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out signed.apk "$APK"
          mv signed.apk "$APK"
          "$AS" verify --print-certs "$APK" | head -3
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: بث محمود ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Notify Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping"
            exit 0
          fi
          MSG="تحديث جديد من تطبيق بث محمود (نسخة ${{ github.run_number }})"
          MSG="$MSG"$'\n'"https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
