name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Place main.dart
        run: |
          if [ -f main.dart ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name mahmoud_stream --org com.mahmoud _tmp
          cp -r _tmp/android android
          rm -rf _tmp

      - name: Allow internet access
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$f"

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BUILD=${{ github.run_number }}
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mahmoud-stream-apk
          path: build/app/outputs/flutter-apk/app-release.apk
